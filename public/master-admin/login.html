<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <title>ISCWORKS — Master Control Center Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .master-login-card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .master-login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    }

    .master-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .master-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .master-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .master-header p {
      font-size: 11px;
      color: #818cf8;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #818cf8;
      font-size: 14px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-master-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-master-login:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ISCWORKS dark SaaS theme */
    body { background: radial-gradient(circle at 50% -20%, rgba(98,81,255,.24), transparent 45%), #0a0a0c; }
    .master-login-card { background:rgba(20,21,27,.92); border-color:rgba(255,255,255,.08); box-shadow:0 26px 80px rgba(0,0,0,.45); }.master-login-card::before { background:#a3ff12; }.master-logo { background:#a3ff12; color:#0a0a0c; box-shadow:none; }.input-wrapper input { background:#101116; border-color:rgba(255,255,255,.1); }.input-wrapper input:focus { border-color:#a3ff12; box-shadow:0 0 0 3px rgba(163,255,18,.12); }.btn-master-login { background:#a3ff12; color:#0a0a0c; }.btn-master-login:hover { background:#c5ff63; }.master-header p,.footer-note { color:#8a8f9e; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; }
      .master-login-card { margin-top: 28px; padding: 28px 20px; border-radius: 12px; }
    }
  </style>
</head>
<body>

<div class="master-login-card">
  <div class="master-header">
    <div class="master-logo">
      <i class="fa-solid fa-crown"></i>
    </div>
    <h1>ISC WORKS</h1>
    <p>MASTER CONTROL CENTER</p>
  </div>

  <div class="alert-danger" id="loginAlert">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span id="loginAlertText">Hatalı kullanıcı adı veya şifre!</span>
  </div>

  <form id="masterLoginForm">
    <div class="form-group">
      <label>Platform E-Posta / Yönetici Adı</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-shield-halved"></i>
        <input type="text" id="masterUsername" placeholder="tonystark@iscworks.com" required autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label>Master Parola</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="masterPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-master-login" id="btnMasterSubmit">
      <i class="fa-solid fa-lock"></i>
      Platform Konsoluna Giriş Yap
    </button>
  </form>

  <div class="footer-note">
    <i class="fa-solid fa-lock text-green"></i> 256-Bit Encrypted Master Security Connection
  </div>
</div>

<script>
  document.getElementById('masterLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('btnMasterSubmit');

    const username = document.getElementById('masterUsername').value.trim();
    const password = document.getElementById('masterPassword').value.trim();

    if (!username || !password) {
      alertText.textContent = 'Lütfen kullanıcı adı ve şifrenizi girin.';
      alertBox.style.display = 'flex';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Doğrulanıyor...';
    alertBox.style.display = 'none';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (response.ok && data.success && data.token) {
        const u = data.user || {};
        
        // Master Admin Verification Check (storeId === 1 && role === OWNER)
        if (u.storeId !== 1 || (u.role !== 'OWNER' && u.role !== 'Super Admin')) {
          alertText.textContent = '⛔ Master Admin yetkiniz bulunmamaktadır.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Platform Konsoluna Giriş Yap';

          setTimeout(() => {
            window.location.href = '/admin/login.html';
          }, 1500);
          return;
        }

        // Store Token & User info in localStorage
        localStorage.setItem('barons_admin_token', data.token);
        localStorage.setItem('barons_admin_user', JSON.stringify(u));
        window.location.href = '/master-admin/index.html';
      } else {
        const errorMsg = data.error?.message || data.error || 'Hatalı kullanıcı adı veya şifre!';
        alertText.textContent = typeof errorMsg === 'string' ? errorMsg : 'Giriş başarısız.';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Platform Konsoluna Giriş Yap';
      }
    } catch (err) {
      alertText.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
      alertBox.style.display = 'flex';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Platform Konsoluna Giriş Yap';
    }
  });
</script>

</body>
</html>
